<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>最后一条消息 - 模块A「110报警电话」</title>
  
  <!-- Visual Stylesheets -->
  <link rel="stylesheet" href="css/crt.css">
  <link rel="stylesheet" href="css/xp-theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Ambient Atmosphere Vignette -->
  <div class="environment-overlay"></div>

  <!-- 4:3 CRT Physical Monitor Enclosure -->
  <div class="crt-monitor-enclosure">
    <div class="crt-bezel">
      <!-- CRT Screen Glass and Visual Shader Surface -->
      <div id="crtScreen" class="crt-screen crt-black-breathing"></div>

      <!-- Realistic Glass Reflection Overlay -->
      <div class="crt-glass-reflection"></div>
    </div>
  </div>

  <!-- Audio Context Activator Overlay (Discreet) -->
  <div id="audioOverlay" class="audio-init-overlay">
    <div class="audio-hint">[ 点击任意位置开启声音体验 ]</div>
  </div>

  <!-- Logic Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/script.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
