<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>最后一条消息 - 模块A「110报警电话」</title>
  
  <!-- Visual Stylesheets -->
  <link rel="stylesheet" href="css/crt.css">

</head>
<body>
  <!-- Ambient Room Vignette -->
  <div class="environment-overlay"></div>

  <!-- 16:9 First-Person Duty Desk Stage with Camera Focus Zoom -->
  <div class="duty-room-stage">

      <div id="crtScreen" class="crt-screen crt-black-breathing"></div>

    <div id="fullscreenContent" class="fullscreen-screen-content"></div>
  </div>

  <!-- Audio Context Activator -->
  <div id="audioOverlay" class="audio-init-overlay">
    <div class="audio-hint">[ 点击任意位置开启声音体验 ]</div>
  </div>

  <!-- Logic Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/script.js"></script>
  <script src="js/main.js"></script>
